name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  contract-and-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run protocol and configuration tests
        run: python -m pytest -q

      - name: Lint Python
        run: ruff check scripts tests

      - name: Lint YAML
        run: yamllint -d relaxed compose.yaml .github/workflows/ci.yml

      - name: Lint shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/check_prereqs.sh

      - name: Validate interpolated Compose configuration
        env:
          HF_CACHE_DIR: /tmp/huggingface-cache
          MODEL_ID: RedHatAI/Qwen3.5-4B-quantized.w4a16
          MODEL_REVISION: 7a613872f394578b0b52b683ff4ac47516b4bcaf
          MODEL_ALIAS: ddu-narrator
          MAX_MODEL_LEN: "4096"
          MAX_NUM_SEQS: "2"
          GPU_MEMORY_UTILIZATION: "0.75"
          REASONING_PARSER: qwen3
        run: docker compose config --quiet

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
