name: local-ai-api-lite-speech

services:
  stt:
    image: local-ai-api-lite-speech:0.1.0
    build:
      context: ../..
      dockerfile: services/speech/Dockerfile
    profiles: [danish-speech]
    command: ["python", "-m", "speech_worker.app", "--role", "stt"]
    expose: ["8080"]
    environment:
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
      STT_CPU_THREADS: "4"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    volumes:
      - type: bind
        source: ${MODEL_CACHE_DIR:?Set MODEL_CACHE_DIR}
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "10001:10001"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 75s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen(
          'http://127.0.0.1:8080/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    networks:
      inference:
        aliases: [ddu-stt]

  tts:
    image: local-ai-api-lite-speech:0.1.0
    build:
      context: ../..
      dockerfile: services/speech/Dockerfile
    profiles: [danish-speech]
    command: ["python", "-m", "speech_worker.app", "--role", "tts"]
    expose: ["8080"]
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIPER_VOICE_DIR: /models/speech/piper
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ${MODEL_CACHE_DIR:?Set MODEL_CACHE_DIR}
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "10001:10001"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 75s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen(
          'http://127.0.0.1:8080/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      inference:
        aliases: [ddu-tts]

  model-installer:
    image: local-ai-api-lite-speech:0.1.0
    build:
      context: ../..
      dockerfile: services/speech/Dockerfile
    profiles: [install]
    entrypoint: ["python", "-m", "speech_worker.install_models"]
    command: ["--plan"]
    environment:
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      HF_HUB_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "0"
      MODEL_ROOT: /models
    volumes:
      - type: bind
        source: ${MODEL_CACHE_DIR:?Set MODEL_CACHE_DIR}
        target: /models
        read_only: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "${MODEL_CACHE_UID:-10001}:${MODEL_CACHE_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  inference:
    name: ddu_inference_bus
    external: true
