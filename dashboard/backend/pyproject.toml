[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-api-lite-dashboard"
version = "0.1.0"
description = "Read-only local dashboard controller for Local-AI-API-LITE"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "psutil>=6,<8",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "ruff>=0.14,<1",
]
gpu = ["nvidia-ml-py>=12,<13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
